# /etc/nginx/sites-enabled/homelab.conf
# Every app gets its own port on the tailnet address (see docs/HARDENING.md).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream jellyfin_upstream {
    server 127.0.0.1:8096 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream immich {
    server [::1]:2283;
}

upstream gunicorn_socket {
    server unix:/run/gunicorn/app.sock fail_timeout=0;
}

# Redirect plain HTTP to HTTPS, but keep ACME challenges reachable.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 100.101.1.2:8096 ssl;
    http2 on;
    server_name jellyfin.tail1234.ts.net "media.home.arpa";

    ssl_certificate     /etc/ssl/tailscale/jellyfin.crt;
    ssl_certificate_key /etc/ssl/tailscale/jellyfin.key;
    include snippets/ssl-params.conf;

    client_max_body_size 20M;

    location / {
        proxy_pass http://jellyfin_upstream;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # keep the client address
        proxy_buffering off;
    }

    location ~ ^/(socket|embywebsocket) {
        proxy_pass http://jellyfin_upstream;
    }
}

server {
    listen 100.101.1.2:3001 ssl;
    server_name status.home.arpa;
    ssl_certificate /etc/ssl/tailscale/status.crt;
    ssl_certificate_key /etc/ssl/tailscale/status.key;

    location / {
        if ($http_user_agent ~* "(bot|crawler|spider)") {
            return 403;
        }
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header X-Note "say \"hi\"; then {leave}";
            return 204;
        }
        proxy_pass http://localhost:3001/;
        proxy_http_version 1.1;
    }
}

server {
    listen 8080;
    listen [::]:8080;
    server_name docs.home.arpa wiki.home.arpa;
    root /var/www/docs/public;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /old {
        return 301 https://docs.home.arpa/#top;
    }
}

server {
    listen 100.101.1.2:2283 ssl;
    listen [fd7a:115c:a1e0::1a01:202]:2283 ssl;
    server_name photos.home.arpa;
    client_max_body_size 50000M;

    location / {
        proxy_pass http://immich;
        proxy_set_header Host $http_host;
    }
}

server {
    listen unix:/run/nginx/internal.sock;
    listen 127.0.0.1:9100;
    server_name ${hostname}.internal;

    location ^~ / {
        proxy_pass http://gunicorn_socket;
    }
}

server {
    listen 127.0.0.1:9200;
    server_name grafana.home.arpa;
    set $grafana_backend "http://127.0.0.1:3000";

    location / {
        proxy_pass $grafana_backend;
    }
}

server {
    listen 100.101.1.2:8920 ssl;
    server_name vault.home.arpa;

    location / {
        proxy_pass http://vaultwarden_backend;
    }
}

