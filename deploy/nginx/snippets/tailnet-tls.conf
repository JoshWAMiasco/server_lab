# Shared TLS settings for every site on the tailnet gateway.
# Install to /etc/nginx/snippets/tailnet-tls.conf and `include snippets/tailnet-tls.conf;` in each
# server block. One Tailscale certificate covers the MagicDNS name on every port.
# The certificate is fetched and renewed by tailscale-cert-renew.{service,timer}.

ssl_certificate     /etc/nginx/tls/ts.crt;
ssl_certificate_key /etc/nginx/tls/ts.key;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:tailnet_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server_tokens off;

# nginx drops server-level add_header lines in any location that has its own add_header.
# Keep add_header out of locations, or repeat these there.
add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Content-Type-Options "nosniff" always;
