# Start nginx after Tailscale, so the 100.x.y.z address it listens on exists.
# Install to /etc/systemd/system/nginx.service.d/after-tailscale.conf, then:
#   sudo systemctl daemon-reload
# Pair it with deploy/sysctl/60-serverlab-nonlocal-bind.conf, which lets nginx bind the
# Tailscale address even if tailscaled has not brought the interface up yet.

[Unit]
After=tailscaled.service
Wants=tailscaled.service
