# ServerLab behind the tailnet gateway.
# Install to /etc/nginx/sites-available/serverlab.conf, link it into sites-enabled/, and replace:
#   TAILSCALE_IP    this server's Tailscale IPv4 address    (tailscale ip -4)
#   MAGICDNS_NAME   this server's MagicDNS name, e.g. homelab.tail1234.ts.net
# Reach it at https://MAGICDNS_NAME/ (port 443). See docs/HARDENING.md section 3.

server {
    # Only the Tailscale address. Never `listen 443` / 0.0.0.0 / [::].
    # nginx 1.25.1+ (Ubuntu 25.04 and later): drop "http2" here and add `http2 on;` instead.
    listen TAILSCALE_IP:443 ssl http2;
    # Optional IPv6 (tailscale ip -6):
    # listen [TAILNET_IPV6_ADDRESS]:443 ssl http2;
    server_name MAGICDNS_NAME;

    include snippets/tailnet-tls.conf;
    client_max_body_size 1m;

    access_log /var/log/nginx/serverlab.access.log;
    error_log  /var/log/nginx/serverlab.error.log;

    # Inherited by both locations below (neither sets its own proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite rather than append: nginx is the edge, so the client cannot spoof this value.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # Live data (Server-Sent Events). Must not be buffered or compressed, and stays open.
    # The app also sends `X-Accel-Buffering: no`; proxy_buffering off makes it explicit.
    location = /api/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
