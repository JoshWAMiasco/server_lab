# Example: Jellyfin behind the tailnet gateway, on its own port.
# Pattern for every hosted app: the app listens on 127.0.0.1 only, nginx listens on the
# Tailscale IP with one unique port per app, all sharing one hostname and one certificate.
#
#   https://MAGICDNS_NAME:8096/  ->  nginx on TAILSCALE_IP:8096  ->  127.0.0.1:18096 (Jellyfin)
#
# Jellyfin in Docker Compose, published on loopback only (Docker-published ports bypass UFW):
#   services:
#     jellyfin:
#       image: jellyfin/jellyfin
#       ports:
#         - "127.0.0.1:18096:8096"
#
# Install to /etc/nginx/sites-available/jellyfin.conf, link it into sites-enabled/, and replace
# TAILSCALE_IP and MAGICDNS_NAME as in serverlab.conf. ServerLab's Lobby reads this file and
# links the Jellyfin card to https://MAGICDNS_NAME:8096.

# On a port other than 443 the browser's Origin includes the port (https://MAGICDNS_NAME:8096),
# but nginx's $host does not. Send $host:$server_port as Host and X-Forwarded-Host, or apps that
# check Origin against Host (CSRF protection, WebSockets) reject every form post as cross-site.
# nginx 1.25.1+ (Ubuntu 25.04 and later): drop "http2" from listen and add `http2 on;` instead.

server {
    listen TAILSCALE_IP:8096 ssl http2;
    server_name MAGICDNS_NAME;

    include snippets/tailnet-tls.conf;
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host:$server_port;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host:$server_port;

    location / {
        proxy_pass http://127.0.0.1:18096;
        # Media streams: pass bytes through instead of buffering them on disk.
        proxy_buffering off;
    }

    # Jellyfin's WebSocket (live updates, remote control).
    location /socket {
        proxy_pass http://127.0.0.1:18096;
        proxy_http_version 1.1;
        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host:$server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 1h;
    }
}
